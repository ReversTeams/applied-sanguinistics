plugins {
    id "eclipse"
    id "idea"
    id "maven-publish"
    id "fabric-loom" version "1.8.+"
}

base {
    archivesName = "${mod_id}-${mod_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version_number.toInteger())

println "Java: ${System.getProperty "java.version"}, JVM: ${System.getProperty "java.vm.version"} (${System.getProperty "java.vendor"}), Arch: ${System.getProperty "os.arch"}"

repositories {
    mavenCentral()

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }

    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // Fabric Loader and API
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // EMI
    // Compile against the EMI API
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    // Include EMI at runtime for local testing
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    // AE2 fabric
    // Compatible with Forge AE2 when the mod is loaded through Sinytra Connector
    modImplementation "maven.modrinth:XxWD5pD3:${ae2_version}"

    // NEEPMeat
    modImplementation "maven.modrinth:neepmeat:${neepmeat_version}"
}

processResources {
    def props = new Properties()
    file("$rootDir/gradle.properties").withInputStream {
        props.load(it) 
    }
    inputs.properties props

    filesMatching([
        "META-INF/fabric.mod.json",
        "pack.mcmeta",
        "${mod_id}.mixins.json".toString()
    ]) {
        expand props
    }
}

// Mixin configuration
loom {
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = java_version_number.toInteger()
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }

    // parity with forge, might remove later
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_author,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : mod_author,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }
}