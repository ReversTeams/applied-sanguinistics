plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
	id "maven-publish"
}

println "Java: ${System.getProperty "java.version"}, JVM: ${System.getProperty "java.vm.version"} (${System.getProperty "java.vendor"}), Arch: ${System.getProperty "os.arch"}"

repositories {
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
        content {
            includeGroup "net.minecraft"
            includeGroupAndSubgroups "com.mojang"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven/"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Terraformers"
                url = "https://maven.terraformersmc.com/releases/"
            }
        }
        filter {
            includeGroup "com.terraformersmc"
        }
    }



    exclusiveContent {
        forRepository {
            maven {
                name = "Sleeping Town"
                url = "https://repo.sleeping.town/"
            }
        }
        filter {
            includeGroup "dev.emi"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    mavenCentral()
}

dependencies {

    // Fabric Loader and API
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // EMI
    // Compile against the EMI API
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    // Include EMI at runtime for local testing
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    // AE2 fabric
    // Compatible with Forge AE2 when the mod is loaded through Sinytra Connector
    modImplementation "maven.modrinth:ae2:${ae2_version}"

    // NEEPMeat
    modImplementation "maven.modrinth:neepmeat:${neepmeat_version}"
}

processResources {
    def props = new Properties()
    file("$rootDir/gradle.properties").withInputStream {
        props.load(it) 
    }
    inputs.properties props

    filesMatching([
        "META-INF/fabric.mod.json",
        "pack.mcmeta",
        "${mod_id}.mixins.json".toString()
    ]) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version_number.toInteger()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaLanguageVersion.of(java_version_number.toInteger())
	targetCompatibility = JavaLanguageVersion.of(java_version_number.toInteger())
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}